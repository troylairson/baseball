<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 588" width="390" height="588" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Animated field mockup: a double to the right-center gap, mid-flight</title>
  <rect width="390" height="588" fill="#0b1120"/>

  <!-- Scoreboard -->
  <rect x="12" y="12" width="366" height="64" rx="14" fill="#111a2e" stroke="#1e293b"/>
  <circle cx="38" cy="44" r="14" fill="#0c2340"/><text x="38" y="48" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">NYY</text>
  <text x="60" y="51" font-size="22" font-weight="700" fill="#f8fafc">3</text>
  <circle cx="98" cy="44" r="14" fill="#bd3039"/><text x="98" y="48" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">BOS</text>
  <text x="120" y="51" font-size="22" font-weight="700" fill="#94a3b8">2</text>
  <text x="168" y="40" font-size="11" fill="#94a3b8">▲ 7th</text>
  <circle cx="171" cy="54" r="4" fill="#f8fafc"/><circle cx="182" cy="54" r="4" fill="none" stroke="#64748b"/>
  <text x="192" y="58" font-size="10" fill="#94a3b8">1 out</text>
  <text x="250" y="40" font-size="11" fill="#94a3b8">Count</text>
  <text x="250" y="58" font-size="16" font-weight="700" fill="#f8fafc">1–2</text>
  <text x="298" y="40" font-size="11" fill="#94a3b8">Pitches</text>
  <text x="298" y="58" font-size="16" font-weight="700" fill="#f8fafc">87</text>

  <g transform="translate(0,-222)">
  <!-- Field (top-down, 0.75 px per foot, home plate at 195,610) -->
  <path d="M195 610 L20 435 Q195 210 370 435 Z" fill="#14532d"/>
  <path d="M195 610 L20 435 Q195 210 370 435 Z" fill="url(#mow)" opacity="0.35"/>
  <defs>
    <pattern id="mow" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#166534"/>
    </pattern>
    <radialGradient id="dirt" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#a16207"/><stop offset="1" stop-color="#854d0e"/>
    </radialGradient>
  </defs>
  <!-- Warning track and wall -->
  <path d="M20 435 Q195 210 370 435" fill="none" stroke="#a16207" stroke-width="9" opacity="0.75"/>
  <path d="M20 435 Q195 210 370 435" fill="none" stroke="#0f172a" stroke-width="3" transform="translate(0,-5)"/>
  <!-- Infield dirt and grass -->
  <path d="M195 610 L130 545 Q195 450 260 545 Z" fill="url(#dirt)"/>
  <path d="M195 592 L160 562 L195 527 L230 562 Z" fill="#15803d"/>
  <circle cx="195" cy="565" r="8" fill="#a16207"/>
  <rect x="192" y="563" width="6" height="2" fill="#f8fafc"/>
  <!-- Foul lines and bases -->
  <path d="M195 610 L20 435 M195 610 L370 435" stroke="#f8fafc" stroke-width="1.2" opacity="0.9"/>
  <rect x="238" y="557" width="9" height="9" fill="#f8fafc" transform="rotate(45 242.5 561.5)"/>
  <rect x="190.5" y="510" width="9" height="9" fill="#f8fafc" transform="rotate(45 195 514.5)"/>
  <rect x="143" y="557" width="9" height="9" fill="#f8fafc" transform="rotate(45 147.5 561.5)"/>
  <path d="M189 608 h12 v5 l-6 5 l-6 -5 z" fill="#f8fafc"/>

  <!-- Ball's ground track (dashed) and landing spot -->
  <path d="M195 604 L265 349" stroke="#f8fafc" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6"/>
  <circle cx="265" cy="349" r="9" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Fielders (fielding team: BOS red), with drift arrows -->
  <g font-size="7" font-weight="700" text-anchor="middle" fill="#fff">
    <g><circle cx="195" cy="563" r="7" fill="#bd3039" stroke="#0b1120" stroke-width="2"/><text x="195" y="565.5">P</text></g>
    <g><circle cx="195" cy="628" r="7" fill="#bd3039" stroke="#0b1120" stroke-width="2"/><text x="195" y="630.5">C</text></g>
    <g><circle cx="246" cy="545" r="7" fill="#bd3039" stroke="#0b1120" stroke-width="2"/><text x="246" y="547.5">1B</text></g>
    <g><circle cx="224" cy="502" r="7" fill="#bd3039" stroke="#0b1120" stroke-width="2"/><text x="224" y="504.5">2B</text></g>
    <g><circle cx="166" cy="502" r="7" fill="#bd3039" stroke="#0b1120" stroke-width="2"/><text x="166" y="504.5">SS</text></g>
    <g><circle cx="146" cy="548" r="7" fill="#bd3039" stroke="#0b1120" stroke-width="2"/><text x="146" y="550.5">3B</text></g>
    <g><circle cx="90" cy="428" r="7" fill="#bd3039" stroke="#0b1120" stroke-width="2"/><text x="90" y="430.5">LF</text></g>
    <g><circle cx="232" cy="362" r="7" fill="#bd3039" stroke="#0b1120" stroke-width="2"/><text x="232" y="364.5">CF</text></g>
    <g><circle cx="283" cy="384" r="7" fill="#bd3039" stroke="#0b1120" stroke-width="2"/><text x="283" y="386.5">RF</text></g>
  </g>
  <path d="M195 372 L226 363" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8"/>
  <path d="M300 428 L286 392" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8"/>
  <!-- Cutoff man drifting out -->
  <path d="M224 502 L236 470" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8"/>

  <!-- Runners (batting team: NYY navy, white ring) -->
  <circle cx="176" cy="532" r="6.5" fill="#0c2340" stroke="#f8fafc" stroke-width="2"/>
  <path d="M176 532 L152 556" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="161" y="531" font-size="8" fill="#cbd5e1" text-anchor="end">Volpe</text>
  <circle cx="214" cy="592" r="6.5" fill="#0c2340" stroke="#f8fafc" stroke-width="2"/>
  <path d="M214 592 L236 568" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="226" y="604" font-size="8" fill="#cbd5e1">Judge</text>

  <!-- The ball in flight: shadow on the track, ball raised by its height -->
  <ellipse cx="240" cy="440" rx="4" ry="2" fill="#000" opacity="0.45"/>
  <circle cx="240" cy="412" r="3.6" fill="#fff"/>
  <path d="M240 412 L240 437" stroke="#fff" stroke-width="0.6" opacity="0.25"/>

  <!-- Callouts -->
  <g font-size="9" fill="#e2e8f0">
    <text x="300" y="333">Landing spot</text>
    <path d="M298 336 L272 346" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="276" y="462">Shadow shows height</text>
    <path d="M274 459 L246 443" stroke="#94a3b8" stroke-width="0.8"/>
  </g>

  </g>
  <g transform="translate(0,-212)">
  <!-- Play caption -->
  <rect x="12" y="650" width="366" height="44" rx="12" fill="#111a2e" stroke="#1e293b"/>
  <text x="26" y="669" font-size="12" font-weight="600" fill="#f8fafc">Judge drives one into the right-center gap…</text>
  <text x="26" y="685" font-size="10" fill="#94a3b8">Exit 108 mph · 31° · Volpe is waved around third</text>

  <!-- Speed control -->
  <rect x="12" y="706" width="230" height="36" rx="10" fill="#111a2e"/>
  <rect x="16" y="710" width="70" height="28" rx="8" fill="#1e293b"/>
  <text x="51" y="728" text-anchor="middle" font-size="11" fill="#94a3b8">Pitch</text>
  <rect x="88" y="710" width="70" height="28" rx="8" fill="#f8fafc"/>
  <text x="123" y="728" text-anchor="middle" font-size="11" font-weight="700" fill="#0b1120">Play</text>
  <text x="196" y="728" text-anchor="middle" font-size="11" fill="#94a3b8">Instant</text>
  <rect x="252" y="706" width="126" height="36" rx="10" fill="#16a34a"/>
  <text x="315" y="728" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Tap to skip ›</text>

  <!-- Decision tray (dimmed while the play runs) -->
  <g opacity="0.35">
    <rect x="12" y="752" width="116" height="36" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="70" y="774" text-anchor="middle" font-size="11" fill="#e2e8f0">Swing away</text>
    <rect x="137" y="752" width="116" height="36" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="195" y="774" text-anchor="middle" font-size="11" fill="#e2e8f0">Steal</text>
    <rect x="262" y="752" width="116" height="36" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="320" y="774" text-anchor="middle" font-size="11" fill="#e2e8f0">Pinch hit</text>
  </g>
  </g>
</svg>
